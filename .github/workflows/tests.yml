# Runs the test suite on Windows, macOS and Linux for every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Only on the public repo: private copies would spend their limited Actions minutes.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the tests
        # The tests use their own temporary data folders, a fake keyring and a fake Claude.
        run: python -m pytest -q -p no:logging tests
